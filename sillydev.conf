; sillydev.conf
; Hosted on Silly Development: https://sillydev.co.uk
;
; Silly Development applies these settings to this server every time this
; repository is deployed: change a value, push, and the next deployment uses it.
; Comment a setting out (put ; in front of it) to leave it to the panel instead.
;
; Only the settings this server lets you change are listed. Never put a secret
; (a token or password) here: anyone who can see the repository can read it.
; Secrets belong in the Startup tab on the panel.

[sillydev]
version = 1

[docker]
; One of: "Nodejs 25", "Nodejs 24", "Nodejs 23", "Nodejs 22", "Nodejs 21", "Nodejs 20", "Nodejs 19", "Nodejs 18", "Nodejs 17", "Nodejs 16", "Nodejs 14", "Nodejs 12"
image = "Nodejs 25"

[variables]

; Additional Node packages: Install additional node packages.
NODE_PACKAGES = ""

; Uninstall Node packages: Uninstall node packages.
UNNODE_PACKAGES = ""

; Main file: The file that starts the app.
MAIN_FILE = "index.js"

; Additional Arguments.: Any extra arguments for nodejs or ts-node
NODE_ARGS = ""
